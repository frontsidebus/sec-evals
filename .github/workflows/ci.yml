# sec-evals CI. Tests run offline (no network access from the tests themselves) and single-threaded. Only distro
# packages are installed; nothing reads a real site.env, and no deck checkout is needed. Actions are pinned to
# commit SHAs (as in local-inference-deck's CI).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Install tools (Ubuntu packages)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-pytest shellcheck
      # vendored deck-tools (tools/deck-tools/README.md): every file matches tools/tools.lock (content and mode);
      # on a pull request, a changed engine must come with a version bump (a re-sync from a newer deck tag)
      - name: deck-tools verify
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 tools/deck-tools/deck-tools verify
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            python3 tools/deck-tools/deck-tools verify --base FETCH_HEAD
          fi
      # the harness files (HARNESS_FILES in evals/run.py) still match evals/harness.pin: an unplanned harness edit
      # would invalidate every gate baseline and the C1 freeze
      - name: harness pin
        run: |
          sha256sum -c --quiet evals/harness.pin
          python3 -m pytest evals/tests/test_harness_pin.py -q -p no:cacheprovider
      # evals/tests includes the contract tests: C5/C6 provider tests and the C3/C4/C9/C10 consumer tests, which read
      # only the vendored copies under evals/tests/fixtures/. Tests that need the deck's real llama-swap template
      # (SPARK_LLAMA_SWAP_TEMPLATE) skip here; the deck's integration run covers them.
      - name: evals tests
        run: python3 -m pytest evals/tests evals/datasets/tests -q -p no:cacheprovider
      - name: check-sanitized (generic secret shapes; no real values in CI)
        run: CI=true bash scripts/check-sanitized.sh --all --regex-only
      - name: shellcheck
        run: |
          shellcheck -S warning scripts/*.sh tools/deck-tools/*.sh tools/deck-tools/pre-commit
          shellcheck -s bash -S error evals/tools/*.sh evals/plans/*.sh

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # the action lists a PR's commits to scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9 (= v2)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
